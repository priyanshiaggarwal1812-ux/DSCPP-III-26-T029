<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeX - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<main>
<div class="grid g4" id="stats"></div>
<div class="card"><div class="card-heading"><h3>System performance</h3><span class="muted" id="sysSrc" style="font-size:11px"></span><a class="link" href="performance.html">Details</a></div><div class="grid g4" id="sys"><div class="skeleton" style="height:48px"></div></div></div>
<div class="card"><div class="card-heading"><h3 id="ptitle">Live price</h3><label class="range-picker">Range <select id="chartRange" aria-label="Price chart range"><option value="60">1 minute</option><option value="300">5 minutes</option><option value="all">All available</option></select></label></div><canvas id="price" class="chart" style="height:240px"></canvas></div>
<div class="card"><div class="card-heading"><h3>Market</h3><div class="watchlist-controls"><button class="btn small" id="showAll">All</button><button class="btn ghost small" id="showWatchlist">Watchlist</button></div></div><div id="symtable"></div></div>
</main>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/dashboard.js"></script>
</body>
</html>
